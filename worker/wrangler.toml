name = "ausbildungs-planer"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Betrifft ausschließlich `vars`: Ohne diesen Schalter überschreibt bzw. löscht
# ein Deploy die im Dashboard gesetzten Variablen, weil diese Datei die Quelle
# der Wahrheit ist. Secrets sind davon nicht betroffen.
# Achtung: muss oberhalb von `[vars]` stehen, sonst wird es als Variable
# innerhalb dieser Tabelle gelesen statt als Konfigurationsschlüssel.
keep_vars = true

# Nicht sensibel – die erlaubte Origin steht ohnehin im öffentlichen App-Quellcode.
# Für lokale Entwicklung (`wrangler dev`) per `--var ALLOWED_ORIGIN:http://localhost:4200`
# überschreiben oder hier temporär anpassen.
[vars]
ALLOWED_ORIGIN = "https://simonschulte.github.io"

# Zugangsdaten als Secrets-Store-Bindings: Die Werte liegen im kontoweiten
# Secrets Store von Cloudflare, hier steht nur, welcher Eintrag unter welchem
# Namen im Worker landet. Damit sind die Bindings reproduzierbar in der
# Konfiguration festgehalten (jeder Deploy setzt sie identisch), ohne dass ein
# Geheimnis ins Repository wandert. `store_id` ist nur eine Kennung.
#
# Von Hand im Dashboard angelegte Bindings sind dagegen unsichtbar für dieses
# Repository – und leicht am falschen Ort gesetzt (die Build-Variablen sehen
# genauso aus, erreichen den Worker zur Laufzeit aber nie).
#
# Die Einträge müssen im Store unter denselben Namen existieren.

[[secrets_store_secrets]]
binding = "APP_SHARED_SECRET"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "APP_SHARED_SECRET"

[[secrets_store_secrets]]
binding = "NEXTCLOUD_BASE_URL"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "NEXTCLOUD_BASE_URL"

[[secrets_store_secrets]]
binding = "NEXTCLOUD_SHARE_TOKEN"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "NEXTCLOUD_SHARE_TOKEN"

# NEXTCLOUD_SHARE_PASSWORD ist bewusst nicht aufgeführt: Die Freigabe hat kein
# Passwort, und der Worker behandelt ein fehlendes Binding als leeres Passwort.
# Bei einer passwortgeschützten Freigabe hier einen vierten Block ergänzen.
